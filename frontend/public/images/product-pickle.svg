<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef2f2"/>
      <stop offset="100%" stop-color="#fee2e2"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)" rx="20"/>
  <!-- Pickle jar -->
  <rect x="135" y="150" width="130" height="150" rx="18" fill="#fb7185" opacity="0.15"/>
  <path d="M145 155 L145 295 Q145 305 200 305 Q255 305 255 295 L255 155 Z" fill="#f43f5e" opacity="0.6"/>
  <!-- Jar lid -->
  <rect x="140" y="130" width="120" height="28" rx="8" fill="#dc2626"/>
  <rect x="150" y="126" width="100" height="10" rx="4" fill="#b91c1c"/>
  <!-- Mango pieces inside -->
  <rect x="165" y="190" width="22" height="18" rx="4" fill="#f59e0b" opacity="0.8" transform="rotate(15 176 199)"/>
  <rect x="195" y="200" width="20" height="16" rx="4" fill="#fbbf24" opacity="0.7" transform="rotate(-10 205 208)"/>
  <rect x="210" y="185" width="18" height="14" rx="3" fill="#d97706" opacity="0.7" transform="rotate(25 219 192)"/>
  <rect x="175" y="215" width="20" height="15" rx="4" fill="#f59e0b" opacity="0.6" transform="rotate(-5 185 222)"/>
  <rect x="220" y="210" width="16" height="13" rx="3" fill="#fbbf24" opacity="0.5" transform="rotate(40 228 216)"/>
  <!-- Oil/spices visible -->
  <ellipse cx="200" cy="230" rx="35" ry="8" fill="#dc2626" opacity="0.15"/>
  <!-- Label -->
  <rect x="160" y="255" width="80" height="30" rx="5" fill="#fffbeb" opacity="0.85"/>
  <text x="200" y="274" text-anchor="middle" font-size="9" fill="#991b1b" font-weight="bold" font-family="sans-serif">MANGO PICKLE</text>
  <!-- Chili decoration -->
  <path d="M305 160 Q310 170 305 180 Q300 170 305 160Z" fill="#ef4444" opacity="0.5"/>
  <text x="200" y="350" text-anchor="middle" font-size="14" fill="#991b1b" font-weight="bold" font-family="sans-serif">ANDHRA MANGO PICKLE</text>
  <text x="200" y="367" text-anchor="middle" font-size="10" fill="#b91c1c" font-family="sans-serif">Homemade · No Preservatives</text>
</svg>
