<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)" rx="20"/>
  <!-- Oil bottle -->
  <rect x="155" y="120" width="90" height="130" rx="12" fill="#86efac" opacity="0.3"/>
  <rect x="165" y="130" width="70" height="110" rx="8" fill="#22c55e" opacity="0.7"/>
  <!-- Bottle neck -->
  <rect x="180" y="100" width="40" height="25" rx="4" fill="#15803d"/>
  <rect x="178" y="95" width="44" height="10" rx="4" fill="#166534"/>
  <!-- Oil inside -->
  <rect x="170" y="170" width="60" height="65" rx="6" fill="#f59e0b" opacity="0.8"/>
  <!-- Label -->
  <rect x="175" y="190" width="50" height="30" rx="4" fill="#fffbeb" opacity="0.85"/>
  <text x="200" y="207" text-anchor="middle" font-size="8" fill="#854d0e" font-weight="bold" font-family="sans-serif">COLD</text>
  <text x="200" y="218" text-anchor="middle" font-size="7" fill="#854d0e" font-family="sans-serif">PRESSED</text>
  <!-- Peanuts -->
  <ellipse cx="130" cy="280" rx="15" ry="10" fill="#d97706" opacity="0.7" transform="rotate(-20 130 280)"/>
  <ellipse cx="270" cy="270" rx="14" ry="9" fill="#b45309" opacity="0.6" transform="rotate(25 270 270)"/>
  <ellipse cx="150" cy="300" rx="12" ry="8" fill="#a16207" opacity="0.5" transform="rotate(-10 150 300)"/>
  <ellipse cx="250" cy="295" rx="13" ry="8" fill="#d97706" opacity="0.5" transform="rotate(15 250 295)"/>
  <ellipse cx="200" cy="310" rx="12" ry="7" fill="#92400e" opacity="0.4"/>
  <text x="200" y="350" text-anchor="middle" font-size="14" fill="#166534" font-weight="bold" font-family="sans-serif">GROUNDNUT OIL</text>
  <text x="200" y="367" text-anchor="middle" font-size="10" fill="#15803d" font-family="sans-serif">Wood Pressed · 100% Pure</text>
  <!-- Drop -->
  <path d="M290 160 Q298 175 290 185 Q282 175 290 160Z" fill="#f59e0b" opacity="0.8"/>
