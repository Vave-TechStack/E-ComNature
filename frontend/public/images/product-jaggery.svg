<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef2f2"/>
      <stop offset="100%" stop-color="#fee2e2"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)" rx="20"/>
  <!-- Jaggery block -->
  <rect x="130" y="150" width="140" height="120" rx="12" fill="#92400e"/>
  <rect x="135" y="155" width="130" height="110" rx="10" fill="#a16207"/>
  <!-- Top surface (lighter) -->
  <path d="M135 155 Q200 145 265 155 L265 165 Q200 155 135 165 Z" fill="#d97706"/>
  <!-- Crack texture -->
  <path d="M160 170 Q175 190 170 210" stroke="#78350f" stroke-width="1.5" fill="none" opacity="0.5"/>
  <path d="M230 165 Q240 185 235 205" stroke="#78350f" stroke-width="1.5" fill="none" opacity="0.4"/>
  <path d="M190 175 Q200 200 195 230" stroke="#78350f" stroke-width="1" fill="none" opacity="0.3"/>
  <!-- Shine -->
  <rect x="145" y="165" width="30" height="15" rx="4" fill="#d97706" opacity="0.5"/>
  <!-- Label -->
  <rect x="160" y="220" width="80" height="30" rx="6" fill="#fffbeb" opacity="0.85"/>
  <text x="200" y="239" text-anchor="middle" font-size="9" fill="#78350f" font-weight="bold" font-family="sans-serif">PALM JAGGERY</text>
  <!-- Palm leaves -->
  <g transform="translate(200, 100)">
    <path d="M0 0 Q-30 -40 -50 -30" stroke="#65a30d" stroke-width="3" fill="#4d7c0f" opacity="0.6"/>
    <path d="M0 0 Q-20 -50 -35 -45" stroke="#65a30d" stroke-width="2.5" fill="#4d7c0f" opacity="0.5"/>
    <path d="M0 0 Q30 -40 50 -30" stroke="#65a30d" stroke-width="3" fill="#4d7c0f" opacity="0.6"/>
    <path d="M0 0 Q20 -50 35 -45" stroke="#65a30d" stroke-width="2.5" fill="#4d7c0f" opacity="0.5"/>
  </g>
  <!-- Jaggery pieces -->
  <rect x="100" y="280" width="25" height="18" rx="4" fill="#a16207" opacity="0.6" transform="rotate(-15 112 289)"/>
  <rect x="280" y="270" width="20" height="15" rx="3" fill="#92400e" opacity="0.5" transform="rotate(20 290 277)"/>
  <text x="200" y="350" text-anchor="middle" font-size="14" fill="#78350f" font-weight="bold" font-family="sans-serif">TRADITIONAL JAGGERY</text>
  <text x="200" y="367" text-anchor="middle" font-size="10" fill="#92400e" font-family="sans-serif">Chemical Free · Mineral Rich</text>
</svg>
