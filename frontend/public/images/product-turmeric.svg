<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)" rx="20"/>
  <!-- Turmeric roots -->
  <g transform="translate(160, 235) rotate(-15)">
    <rect x="-8" y="-70" width="16" height="100" rx="8" fill="#d97706"/>
    <rect x="-12" y="-60" width="10" height="40" rx="5" fill="#b45309" transform="rotate(-30 -7 -40)"/>
    <rect x="4" y="-50" width="10" height="35" rx="5" fill="#a16207" transform="rotate(25 9 -32)"/>
    <rect x="-14" y="-45" width="8" height="25" rx="4" fill="#92400e" transform="rotate(-45 -10 -32)"/>
    <rect x="6" y="-40" width="8" height="20" rx="4" fill="#92400e" transform="rotate(50 10 -30)"/>
  </g>
  <!-- Second root -->
  <g transform="translate(250, 240) rotate(10)">
    <rect x="-6" y="-55" width="12" height="80" rx="6" fill="#b45309" opacity="0.8"/>
    <rect x="-10" y="-45" width="8" height="30" rx="4" fill="#92400e" opacity="0.7" transform="rotate(-25 -6 -30)"/>
    <rect x="3" y="-40" width="7" height="25" rx="4" fill="#a16207" opacity="0.7" transform="rotate(30 6 -27)"/>
  </g>
  <!-- Curcumin powder pile -->
  <ellipse cx="200" cy="300" rx="50" ry="15" fill="#d97706" opacity="0.7"/>
  <ellipse cx="200" cy="297" rx="35" ry="8" fill="#f59e0b" opacity="0.5"/>
  <!-- Label -->
  <text x="200" y="345" text-anchor="middle" font-size="14" fill="#9a3412" font-weight="bold" font-family="sans-serif">LAKADONG TURMERIC</text>
  <text x="200" y="362" text-anchor="middle" font-size="10" fill="#c2410c" font-family="sans-serif">7-12% Curcumin · Premium Grade</text>
  <!-- Small star/certification -->
  <polygon points="310,140 316,156 333,156 319,166 324,183 310,173 296,183 301,166 287,156 304,156" fill="#f59e0b" opacity="0.4"/>
</svg>
