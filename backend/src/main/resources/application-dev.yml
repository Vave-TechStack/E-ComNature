# ==========================================
# Development Profile - H2 In-Memory Database
# ==========================================
# Override PostgreSQL with H2 for local development without Docker/PostgreSQL

spring:
  datasource:
    url: jdbc:h2:mem:ecom_nature;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  # Disable services that require external infrastructure
  data:
    redis:
      host: localhost
      port: 6379
    elasticsearch:
      uris: http://localhost:9200

  rabbitmq:
    host: localhost
    port: 5672

  mail:
    host: localhost
    port: 3025

# JWT secret for development only
app:
  jwt:
    secret: ZGV2ZWxvcG1lbnQtc2VjcmV0LWZvci1lY29tLW5hdHVyZS1wbGF0Zm9ybS0yMDI2
    access-token-expiration: 86400000  # 24 hours (easier for dev)
    refresh-token-expiration: 2592000000
