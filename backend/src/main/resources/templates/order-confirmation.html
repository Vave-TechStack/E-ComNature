<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmed</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 0; background-color: #f4f4f4; }
        .container { max-width: 600px; margin: 40px auto; background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 24px rgba(0,0,0,0.08); }
        .header { background: linear-gradient(135deg, #059669, #10b981); padding: 32px; text-align: center; }
        .header h1 { color: white; margin: 0; font-size: 24px; }
        .body { padding: 32px; }
        .order-number { background: #f0fdf4; padding: 16px; border-radius: 8px; text-align: center; font-size: 18px; font-weight: 600; color: #059669; margin: 16px 0; }
        .footer { padding: 24px 32px; text-align: center; color: #6b7280; font-size: 12px; border-top: 1px solid #e5e7eb; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Order Confirmed!</h1>
        </div>
        <div class="body">
            <p>Hello <strong th:text="${name}">User</strong>,</p>
            <p>Your order has been confirmed. Here's your order number:</p>
            <div class="order-number" th:text="${orderNumber}">ORD-123456</div>
            <p>We'll notify you when your order ships. Thank you for choosing EcomNature!</p>
        </div>
        <div class="footer">
            <p>&copy; 2026 EcomNature. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
